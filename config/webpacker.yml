# Note: You must restart bin/webpack-dev-server for changes to take effect
#
# Migrated to Webpacker 5's shape (UPGRADE_PLAN.md Phase 2c). Deviations from the v5
# template, both deliberate:
#
#   * `extensions` keeps this app's .tsx/.ts/.jsx entries, which the template drops.
#   * `extract_css` is false in every environment, including production. This app's
#     `config/webpack/environment.js` replaces Webpacker's built-in `.css` rule with its
#     own style-loader + css-loader chain, so CSS has always been inlined into the JS
#     bundle rather than extracted -- which is why there is no `stylesheet_pack_tag` in
#     app/views/web/index.html.erb. Setting this true would only take effect alongside
#     that tag, so it stays false; see Phase 2d.

default: &default
  source_path: app/javascript
  source_entry_path: packs
  public_root_path: public
  public_output_path: packs
  cache_path: tmp/cache/webpacker
  webpack_compile_output: true

  # Additional paths webpack should lookup modules
  # ['app/assets', 'engine/foo/app/assets']
  additional_paths: []

  # Reload manifest.json on all requests so we reload latest compiled packs
  cache_manifest: false

  # Extract and emit a css file
  extract_css: false

  static_assets_extensions:
    - .jpg
    - .jpeg
    - .png
    - .gif
    - .tiff
    - .ico
    - .svg
    - .eot
    - .otf
    - .ttf
    - .woff
    - .woff2

  extensions:
    - .mjs
    - .tsx
    - .ts
    - .jsx
    - .js
    - .sass
    - .scss
    - .css
    - .module.sass
    - .module.scss
    - .module.css
    - .png
    - .svg
    - .gif
    - .jpeg
    - .jpg

development:
  <<: *default
  compile: true

  # Reference: https://webpack.js.org/configuration/dev-server/
  dev_server:
    https: false
    host: localhost
    port: 3035
    public: localhost:3035
    hmr: false
    # Inline should be set to true if using HMR
    inline: true
    overlay: true
    compress: true
    disable_host_check: true
    use_local_ip: false
    quiet: false
    pretty: false
    headers:
      'Access-Control-Allow-Origin': '*'
    watch_options:
      ignored: '**/node_modules/**'


test:
  <<: *default
  compile: true

  # Compile test packs to a separate directory
  public_output_path: packs-test

production:
  <<: *default

  # Production depends on precompilation of packs prior to booting for performance.
  compile: false

  # Cache manifest.json for performance
  cache_manifest: true
